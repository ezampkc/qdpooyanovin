<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد کیفیت - شرکت پویانوین قطعه جی | هلدینگ عظام</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@font-face { font-family: 'BNazanin'; src: local('B Nazanin'), local('BNazanin'), local('B-Nazanin'); }

:root {
    --bg-main: #f0f4f8; --bg-card: #ffffff; --bg-chart: #fafbfd; --bg-filter: #ffffff;
    --text-main: #1a2a44; --text-sec: #4a5568; --border: #d0d7e2; --border-light: #e0e6ed;
    --primary: #0d3b66; --accent: #c9a227; --shadow: rgba(0,0,0,0.08);
    --desc-bg: #f0f4f9; --tab-inactive: #e8edf4; --subtab-text: #445;
    --footer-bg: #0d3b66; --footer-text: #ffffff; --input-bg: #fafbfd;
    --update-bg: #fff8e1; --update-border: #e6b84d; --update-text: #5a4a00;
    --avg-bg: #e8f5e9; --avg-border: #4caf50; --avg-text: #1b5e20;
}
[data-theme="dark"] {
    --bg-main: #0f1724; --bg-card: #1a2332; --bg-chart: #1e2a3d; --bg-filter: #1a2332;
    --text-main: #e4e9f2; --text-sec: #a0aec0; --border: #2d3748; --border-light: #2d3748;
    --primary: #4a90d9; --accent: #e6b84d; --shadow: rgba(0,0,0,0.4);
    --desc-bg: #1e2a3d; --tab-inactive: #2d3748; --subtab-text: #cbd5e0;
    --footer-bg: #0a1120; --footer-text: #e4e9f2; --input-bg: #1e2a3d;
    --update-bg: #2d2416; --update-border: #e6b84d; --update-text: #f5d97a;
    --avg-bg: #1b3a2a; --avg-border: #66bb6a; --avg-text: #a5d6a7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; background: var(--bg-main); color: var(--text-main); line-height: 1.8; transition: background 0.3s, color 0.3s; }
.english { font-family: 'Times New Roman', Times, serif; }

header {
    background: linear-gradient(135deg, var(--primary) 0%, #1e5a8e 100%);
    color: #fff; padding: 25px 40px; box-shadow: 0 4px 12px var(--shadow);
    border-bottom: 4px solid var(--accent);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px;
}
header .title-block { display: flex; flex-direction: column; align-items: center; gap: 6px; }
header .title-block h1 { font-size: 30px; letter-spacing: 0.5px; font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; font-weight: bold; }
header .title-block h1 .holding { font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; font-weight: bold; font-size: 30px; opacity: 0.95; }
header .title-block h1 .divider { margin: 0 10px; opacity: 0.7; }
.update-bar {
    background: var(--update-bg); border: 1px solid var(--update-border); border-radius: 20px;
    padding: 6px 18px; font-size: 14px; color: var(--update-text);
    display: inline-flex; align-items: center; gap: 8px; margin-top: 6px;
    font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif;
}
.update-bar .label { font-weight: bold; }
.update-bar .date { font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; font-weight: bold; }

.theme-toggle {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    padding: 8px 16px; border-radius: 25px; cursor: pointer; font-family: inherit; font-size: 14px;
    display: inline-flex; align-items: center; gap: 8px; transition: all 0.25s;
}
.theme-toggle:hover { background: rgba(255,255,255,0.25); }

.container { max-width: 1400px; margin: 25px auto; padding: 0 20px; }

.filter-panel {
    background: var(--bg-filter); border: 1px solid var(--border); border-radius: 8px;
    padding: 18px 22px; margin-bottom: 20px; box-shadow: 0 2px 6px var(--shadow);
    display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
}
.filter-panel label { font-weight: bold; margin-left: 8px; color: var(--primary); }
.filter-panel select {
    font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; padding: 7px 12px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--input-bg); color: var(--text-main);
    font-size: 14px; min-width: 120px; cursor: pointer;
}
.filter-panel select:focus { outline: 2px solid var(--primary); }
.filter-panel select:disabled { opacity: 0.5; cursor: not-allowed; }

.mode-box {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--desc-bg);
    border: 1px dashed var(--primary); border-radius: 5px;
    cursor: pointer; user-select: none;
}
.mode-box input { cursor: pointer; width: 16px; height: 16px; }
.mode-box label { margin: 0; cursor: pointer; font-size: 13px; color: var(--text-main); font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; }
.mode-box.active-mode { background: var(--primary); border-color: var(--primary); }
.mode-box.active-mode label { color: #fff; font-weight: bold; }

.btn-reset {
    font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; padding: 8px 16px; background: #6c757d; color: #fff;
    border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-right: auto;
}
.btn-reset:hover { background: #545b62; }

.tabs {
    display: flex; flex-wrap: wrap; gap: 4px; background: var(--bg-card);
    padding: 8px; border-radius: 8px 8px 0 0; border-bottom: 3px solid var(--accent);
}
.tab-btn {
    font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; padding: 9px 16px; background: var(--tab-inactive);
    border: 1px solid var(--border); border-radius: 5px 5px 0 0;
    cursor: pointer; font-size: 14px; color: var(--text-main); transition: all 0.25s;
}
.tab-btn:hover { filter: brightness(0.95); }
.tab-btn.active { color: #fff; font-weight: bold; border-color: transparent; }

.tab-content {
    background: var(--bg-card); border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 8px 8px; padding: 22px; min-height: 500px; box-shadow: 0 2px 6px var(--shadow);
}
.tab-pane { display: none; }
.tab-pane.active { display: block; }

.sub-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px; }
.sub-tab-btn {
    font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; padding: 6px 13px; background: transparent;
    border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
    font-size: 13px; color: var(--subtab-text); transition: all 0.2s;
}
.sub-tab-btn:hover { background: var(--desc-bg); }
.sub-tab-btn.active { color: #fff; font-weight: bold; border-color: transparent; }

.chart-wrapper { background: var(--bg-chart); border: 1px solid var(--border-light); border-radius: 6px; padding: 18px; margin-bottom: 18px; }
.chart-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--accent);
    flex-wrap: wrap; gap: 10px;
}
.chart-title { font-size: 17px; color: var(--primary); font-weight: bold; flex: 1; min-width: 200px; font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; }

.header-badges { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.unit-badge {
    padding: 5px 14px; border-radius: 15px; font-size: 14px; font-weight: bold;
    color: #fff; font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; letter-spacing: 0.5px;
    display: inline-flex; align-items: center; gap: 6px;
}
.unit-badge .unit-label { font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; font-size: 13px; opacity: 0.95; }

.avg-card {
    background: var(--avg-bg); border: 2px solid var(--avg-border);
    border-radius: 8px; padding: 6px 14px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--avg-text); font-weight: bold;
    flex-direction: column;
}
.avg-card .avg-label { font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; }
.avg-card .avg-value {
    font-family: 'Times New Roman', Times, serif; font-size: 15px;
    font-weight: bold; direction: ltr; color: var(--avg-text);
}
.avg-card .avg-percent {
    font-family: 'Times New Roman', Times, serif; font-size: 12px;
    direction: ltr; color: var(--avg-text); opacity: 0.85;
}

.chart-container { position: relative; height: 450px; margin-bottom: 10px; }
.chart-description {
    margin-top: 16px; padding: 14px 16px; background: var(--desc-bg);
    border-right: 4px solid var(--primary); border-radius: 4px;
    font-size: 14px; color: var(--text-sec); line-height: 2; text-align: justify;
    font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif;
}
.chart-description strong { color: var(--primary); }

.multi-chart-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px;
}
.multi-chart-grid .chart-container { height: 320px; position: relative; border: 1px solid var(--border-light); border-radius: 6px; padding: 10px; background: var(--bg-card); }
.multi-chart-grid .multi-label {
    position: absolute; top: 8px; right: 12px;
    background: var(--primary); color: #fff;
    padding: 3px 10px; border-radius: 12px;
    font-size: 12px; font-weight: bold; z-index: 10;
    font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif;
}

footer { background: var(--footer-bg); color: var(--footer-text); padding: 20px; text-align: center; margin-top: 40px; border-top: 4px solid var(--accent); }
footer p { margin: 4px 0; font-size: 14px; font-family: 'BNazanin', 'B Nazanin', 'Tahoma', serif; }
footer a { color: var(--accent); text-decoration: none; font-family: 'Times New Roman', Times, serif; }
footer a:hover { text-decoration: underline; }

.sub-pane { display: none; }
.sub-pane.active { display: block; }

@media (max-width: 768px) {
    header { padding: 18px 20px; }
    header .title-block h1 { font-size: 22px; }
    header .title-block h1 .holding { font-size: 22px; }
    .filter-panel { flex-direction: column; align-items: stretch; }
    .chart-container { height: 350px; }
    .multi-chart-grid { grid-template-columns: 1fr; }
    .btn-reset { margin-right: 0; }
}
</style>
</head>
<body>

<header>
    <div class="title-block">
        <h1>
            داشبورد کیفیت شرکت پویانوین قطعه جی
            <span class="divider">|</span>
            <span class="holding">هلدینگ عظام</span>
        </h1>
        <div class="update-bar">
            <span class="label">آخرین به‌روزرسانی:</span>
            <span class="date">مهر 1405</span>
        </div>
    </div>
    <button class="theme-toggle" id="themeToggle" title="تغییر حالت نمایش">
        <span class="icon" id="themeIcon">🌙</span>
        <span id="themeLabel">حالت شب</span>
    </button>
</header>

<div class="container">

    <div class="filter-panel">
        <div>
            <label for="yearFilter">سال:</label>
            <select id="yearFilter">
                <option value="all">همه سال‌ها</option>
                <option value="1402">1402</option>
                <option value="1403">1403</option>
                <option value="1404">1404</option>
                <option value="1405">1405</option>
            </select>
        </div>
        <div>
            <label for="monthFilter">ماه:</label>
            <select id="monthFilter">
                <option value="all">همه ماه‌ها</option>
                <option value="1">فروردین</option><option value="2">اردیبهشت</option>
                <option value="3">خرداد</option><option value="4">تیر</option>
                <option value="5">مرداد</option><option value="6">شهریور</option>
                <option value="7">مهر</option><option value="8">آبان</option>
                <option value="9">آذر</option><option value="10">دی</option>
                <option value="11">بهمن</option><option value="12">اسفند</option>
            </select>
        </div>
        <div>
            <label for="viewModeFilter">نمایش:</label>
            <select id="viewModeFilter">
                <option value="monthly">ماهانه</option>
                <option value="quarterly">سه‌ماهه</option>
                <option value="semiannual">شش‌ماهه</option>
                <option value="yearly">سالانه</option>
            </select>
        </div>
        <div class="mode-box" id="modeOverviewBox">
            <input type="checkbox" id="modeOverview">
            <label for="modeOverview">در یک نگاه</label>
        </div>
        <div class="mode-box" id="modeYoYBox">
            <input type="checkbox" id="modeYoY">
            <label for="modeYoY">مقایسه سر به سر سال‌ها</label>
        </div>
        <button class="btn-reset" onclick="resetFilters()">بازنشانی فیلترها</button>
    </div>

    <div class="tabs" id="mainTabs">
        <button class="tab-btn active" data-tab="internal">TOTAL PPM (ضایعات داخلی)</button>
        <button class="tab-btn" data-tab="rework">TOTAL INTERNAL PPM (دوباره‌کاری)</button>
        <button class="tab-btn" data-tab="receiving-pz">RECEIVING PPM (پایاذوب کاوه)</button>
        <button class="tab-btn" data-tab="receiving-rp">RECEIVING PPM (رهپویان)</button>
        <button class="tab-btn" data-tab="external">EXTERNAL PPM (برگشت از فروش)</button>
        <button class="tab-btn" data-tab="oee">شاخص OEE</button>
        <button class="tab-btn" data-tab="mtbf">MTBF / MTTR</button>
    </div>

    <div class="tab-content" id="tabContent"></div>
</div>

<footer>
    <p><strong>داشبورد کیفیت شرکت پویانوین قطعه جی | هلدینگ عظام</strong></p>
    <p>گردآورنده: واحد تضمین کیفیت | Copyright © <span class="english">Abbas Sadeghi</span></p>
    <p>ارتباط: <a href="mailto:1abbassdgh@gmail.com" class="english">1abbassdgh@gmail.com</a></p>
</footer>

<script>
const MONTHS_FA = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const SEASONS_FA = ['بهار','تابستان','پاییز','زمستان'];
const YEARS = [1402, 1403, 1404, 1405];

function buildMonthlyLabels() {
    const labels = [];
    YEARS.forEach(y => MONTHS_FA.forEach(m => labels.push(m + ' ' + String(y).slice(-2))));
    return labels;
}
const ALL_MONTHLY_LABELS = buildMonthlyLabels();

const TAB_COLORS = {
    'internal':     { light: '#0d3b66', dark: '#5ba3e0' },
    'rework':       { light: '#8b4513', dark: '#d49a6a' },
    'receiving-pz': { light: '#2e7d32', dark: '#66bb6a' },
    'receiving-rp': { light: '#6a1b9a', dark: '#ba68c8' },
    'external':     { light: '#c62828', dark: '#ef5350' },
    'oee':          { light: '#ef6c00', dark: '#ffb74d' },
    'mtbf':         { light: '#00838f', dark: '#4dd0e1' }
};
const YOY_COLORS = ['#0d3b66', '#c62828', '#2e7d32', '#ef6c00'];
const YOY_COLORS_DARK = ['#5ba3e0', '#ef5350', '#66bb6a', '#ffb74d'];

function getTabColor(tabKey) {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const palette = TAB_COLORS[tabKey] || TAB_COLORS['internal'];
    return isDark ? palette.dark : palette.light;
}
function getYoyColors() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    return isDark ? YOY_COLORS_DARK : YOY_COLORS;
}

const TAB_STRUCTURE = {
    'internal': {
        title: 'TOTAL PPM (ضایعات داخلی)',
        subtabs: [
            { id: 'internal-total', label: 'مجموع ضایعات داخلی', chartTitle: 'مجموع ضایعات ماشینکاری داخلی پویانوین (TOTAL PPM)', unit: 'PPM',
              desc: 'در این دسته‌بندی آمار تولید و ضایعات بوش TU3 وارد نشده است، زیرا تمام مراحل ماشینکاری توسط تأمین‌کننده انجام می‌گردد. برای گروه محصول براکت به جای آمار تولید، آمار «برگشت امانی ما نزد دیگران – برگشت به خرید» از راهکاران اخذ و جایگذاری شده است.' },
            { id: 'internal-bush', label: 'گروه بوش', chartTitle: 'ضایعات گروه محصول بوش با منشا ماشینکاری', unit: 'PPM',
              desc: 'این قسمت تنها شامل آمار تولیدی بوش XU7 (خروجی OP20) و ضایعات ماشینکاری آن در تمام OPها است. ضایعات و تولید بوش TU3 در این قسمت نیامده است زیرا این محصول تماماً برونسپاری می‌شود.' },
            { id: 'internal-disk', label: 'گروه دیسک و کاسه', chartTitle: 'ضایعات گروه محصول دیسک و کاسه با منشا ماشینکاری', unit: 'PPM',
              desc: 'پیک ضایعات در اسفند 1403 به دلیل تولید کم این ماه نسبت به ماه‌های گذشته بوده است. از مهر 1405 بخشی از آمار تولید قطعات دیسک هواخنک تا مرحله بالانس و سنگ‌زنی برونسپاری می‌گردد.' },
            { id: 'internal-bracket', label: 'گروه براکت', chartTitle: 'ضایعات گروه محصول براکت با منشا ماشینکاری', unit: 'PPM',
              desc: 'با توجه به اینکه مراحل ماشینکاری قطعه براکت توسط پیمانکار انجام می‌شود و تنها دوباره‌کاری قطعات محصول در شرکت پویانوین انجام می‌گیرد، امکان ضایع شدن در شرکت پویانوین وجود دارد.' },
            { id: 'internal-cylinder', label: 'گروه سرسیلندر', chartTitle: 'ضایعات گروه محصول سرسیلندر با منشا ماشینکاری', unit: 'PPM',
              desc: 'تولید سرسیلندر در شرکت پویانوین از خرداد 1403 آغاز گردید اما همچنان به تولید انبوه نرسیده، لذا داده تاریخی جهت ثبت آمار ضایعات داخلی همچنان موجود نیست.' }
        ]
    },
    'rework': {
        title: 'TOTAL INTERNAL PPM (دوباره‌کاری)',
        subtabs: [
            { id: 'rework-total', label: 'مجموع دوباره‌کاری داخلی', chartTitle: 'مجموع دوباره‌کاری داخلی پویانوین (TOTAL INTERNAL PPM)', unit: 'PPM',
              desc: 'در این دسته‌بندی قطعه بوش TU3 به دلیل ماشینکاری کامل توسط پیمانکار لحاظ نشده است. افزایش میزان دوباره‌کاری در اسفند 04 به دلیل تولید کم قطعات در این ماه است.' },
            { id: 'rework-bush', label: 'گروه بوش', chartTitle: 'دوباره‌کاری گروه محصول بوش', unit: 'PPM',
              desc: 'افزایش PPM دوباره‌کاری گروه محصول بوش در فروردین 05 به دلیل انجام عملیات مجدد برروی بوش‌های XU7 برگشتی و تبدیل آنها به محصول بوده است.' },
            { id: 'rework-disk', label: 'گروه دیسک و کاسه', chartTitle: 'دوباره‌کاری گروه محصول دیسک و کاسه', unit: 'PPM',
              desc: 'پیک دوباره‌کاری در اسفند 03 به دلیل تولید کم قطعه در این ماه و بازکاری قطعات شش ماه دوم سال در این ماه می‌باشد.' },
            { id: 'rework-bracket', label: 'گروه براکت', chartTitle: 'دوباره‌کاری گروه محصول براکت', unit: 'PPM',
              desc: 'با توجه به اینکه تمام قطعات محصول براکت دنا داخل شرکت پویانوین در قسمت قلاویز M7 و M14 بازکاری می‌شوند، مقدار PPM برابر 1,000,000 است.' },
            { id: 'rework-cylinder', label: 'گروه سرسیلندر', chartTitle: 'دوباره‌کاری گروه محصول سرسیلندر', unit: 'PPM',
              desc: 'با توجه به عدم تولید انبوه این گروه محصول، داده‌ای جهت محاسبه PPM دوباره‌کاری ثبت نشده است.' }
        ]
    },
    'receiving-pz': {
        title: 'RECEIVING PPM (پایاذوب کاوه)',
        subtabs: [

function getFilteredIndices() {
    const year = document.getElementById('yearFilter').value;
    const month = document.getElementById('monthFilter').value;
    let indices = [];
    for (let i = 0; i < 48; i++) indices.push(i);
    if (year !== 'all') {
        const y = parseInt(year);
        indices = indices.filter(i => YEARS[Math.floor(i/12)] === y);
    }
    if (month !== 'all') {
        const m = parseInt(month) - 1;
        indices = indices.filter(i => (i % 12) === m);
    }
    return indices;
}

function calcPPM(productionArr, scrapArr) {
    let totalProd = 0, totalScrap = 0;
    for (let i = 0; i < productionArr.length; i++) {
        const p = productionArr[i], s = scrapArr[i];
        if (!isNaN(p) && p !== null && p > 0) totalProd += p;
        if (!isNaN(s) && s !== null) totalScrap += s;
    }
    if (totalProd === 0) return null;
    return (totalScrap / totalProd) * 1000000;
}

/* ⭐ اصلاح: تابع PPM ماهانه - اگر production=0 و scrap=0 باشد، PPM=0 */
function getMonthlyPPM(seriesKey) {
    const series = DATA[seriesKey];
    const indices = getFilteredIndices();
    const labels = [], data = [];
    indices.forEach(i => {
        const p = series.production[i], s = series.scrap[i];
        if (!isNaN(p) && p !== null && !isNaN(s) && s !== null) {
            labels.push(ALL_MONTHLY_LABELS[i]);
            if (p === 0) {
                if (s === 0) {
                    data.push(0);
                } else {
                    data.push(null);
                }
            } else {
                data.push(+((s / p) * 1000000).toFixed(2));
            }
        }
    });
    return { labels, data };
}

function aggregatePPMQuarterly(production, scrap, indices) {
    const quarters = {};
    const order = [];
    indices.forEach(i => {
        const monthIdx = i % 12;
        const year = YEARS[Math.floor(i/12)];
        const q = monthIdx <= 2 ? 0 : monthIdx <= 5 ? 1 : monthIdx <= 8 ? 2 : 3;
        const key = SEASONS_FA[q] + ' ' + String(year).slice(-2);
        if (!quarters[key]) { quarters[key] = { prod: 0, scrap: 0 }; order.push(key); }
        const p = production[i], s = scrap[i];
        if (!isNaN(p) && p !== null && p > 0) quarters[key].prod += p;
        if (!isNaN(s) && s !== null) quarters[key].scrap += s;
    });
    const labels = [], data = [];
    order.forEach(k => {
        if (quarters[k].prod > 0) {
            labels.push(k);
            data.push(+((quarters[k].scrap / quarters[k].prod) * 1000000).toFixed(2));
        }
    });
    return { labels, data };
}

    });
    const outLabels = [], outData = [];
    order.forEach(k => {
        if (years[k].count > 0) {
            outLabels.push('سال ' + k);
            outData.push(+(years[k].sum / years[k].count).toFixed(4));
        }
    });
    return { labels: outLabels, data: outData };
}

function parseQuarterLabel(raw) {
    if (!raw) return null;
    const parts = String(raw).trim().split(/\s+/);
    const qi = SEASONS_FA.indexOf(parts[0]);
    if (qi < 0) return null;
    let n = parseInt(parts[1], 10);
    if (isNaN(n)) return null;
    const year = n < 100 ? 1400 + n : n;
    if (year < 1402 || year > 1405) return null;
    return { year, qi, index: (year - 1402) * 4 + qi };
}

function getQuarterTimeline(series) {
    const tl = new Array(16).fill(null);
    if (!series || !series.labels) return tl;
    series.labels.forEach((label, i) => {
        const p = parseQuarterLabel(label);
        if (!p) return;
        const v = series.values[i];
        tl[p.index] = (v === null || v === undefined || isNaN(v)) ? null : Number(v);
    });
    return tl;
}

function maskTimelineByYear(tl, yearValue) {
    if (yearValue === 'all') return tl.slice();
    const y = parseInt(yearValue);
    return tl.map((v, i) => (1402 + Math.floor(i / 4) === y) ? v : null);
}

function quarterGroupLabel(startIndex, spanQuarters) {
    const y = 1402 + Math.floor(startIndex / 4);
    const qi = startIndex % 4;
    const yy = String(y).slice(-2);
    if (spanQuarters === 1) return SEASONS_FA[qi] + ' ' + yy;
    if (spanQuarters === 2) return (qi === 0 ? 'نیمه اول ' : 'نیمه دوم ') + yy;
    return 'سال ' + yy;
}

function aggregateQuarterTimeline(tl, spanQuarters) {
    const out = { labels: [], data: [] };
    for (let start = 0; start < 16; start += spanQuarters) {
        const chunk = [];
        for (let k = 0; k < spanQuarters; k++) {
            const idx = start + k;
            if (idx < 16 && tl[idx] !== null && !isNaN(tl[idx])) {
                chunk.push(tl[idx]);
            }
        }
        if (chunk.length === 0) continue;
        const sum = chunk.reduce((a, b) => a + b, 0);
        out.labels.push(quarterGroupLabel(start, spanQuarters));
        out.data.push(+(sum / chunk.length).toFixed(2));
    }
    return out;
}

function calculateAverage(seriesKey) {
    const series = DATA[seriesKey];
    if (!series) return null;
    
    if (series.quarterly) {
        const year = document.getElementById('yearFilter').value;
        const tl = maskTimelineByYear(getQuarterTimeline(series), year);
        const valid = tl.filter(v => v !== null && !isNaN(v));
        if (!valid.length) return null;
        return valid.reduce((a, b) => a + b, 0) / valid.length;
    }
    
    if (series.isOEE) {
        const indices = getFilteredIndices();
        const valid = indices.map(i => series.values[i]).filter(v => !isNaN(v) && v !== null);
        if (!valid.length) return null;
        return valid.reduce((a, b) => a + b, 0) / valid.length;
    }
    
    const indices = getFilteredIndices();
    return calcPPM(
        indices.map(i => series.production[i]),
        indices.map(i => series.scrap[i])
    );
}

function formatAvgValue(value, series) {
    if (value === null || isNaN(value)) return { main: '-', percent: '' };
    if (series.isPercent) {
        return { main: (value * 100).toFixed(2) + '%', percent: '' };
    }
    if (series.unit === 'PPM') {
        const ppm = Math.round(value);
        const percent = (value / 10000).toFixed(2);
        return { main: ppm.toLocaleString('en-US'), percent: `(${percent}%)` };
    }
    return { main: value.toFixed(2), percent: '' };
}

function getChartOptions(series) {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const gridColor = isDark ? '#3d4a5e' : '#d0d7e2';
    const textColor = isDark ? '#e4e9f2' : '#1a2a44';
    const isPercent = series.isPercent || false;
    
    return {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 400 },
        plugins: {
            legend: {
                labels: {
                    font: { family: "'BNazanin','B Nazanin','Tahoma',serif", size: 15, weight: 'bold' },
                    color: textColor,
                    padding: 15,
                    usePointStyle: true,
                    pointStyle: 'circle'
                }
            },
            tooltip: {
                titleFont: { family: "'BNazanin','B Nazanin','Tahoma',serif", size: 15, weight: 'bold' },
                bodyFont: { family: "'Times New Roman',Times,serif", size: 15, weight: 'bold' },
                backgroundColor: isDark ? '#2d3748' : '#fff',
                titleColor: isDark ? '#fff' : '#0d3b66',
                bodyColor: isDark ? '#e4e9f2' : '#1a2a44',
                borderColor: isDark ? '#4a90d9' : '#0d3b66',
                borderWidth: 1,
                padding: 12,
                displayColors: true,
                callbacks: {
                    label: function(ctx) {
                        let v = ctx.parsed.y;
                        if (v === null || isNaN(v)) return ctx.dataset.label + ': -';
                        if (isPercent) {
                            return ctx.dataset.label + ': ' + (v * 100).toFixed(2) + '%';
                        } else if (series.unit === 'PPM') {
                            const ppm = Math.round(v);
                            const percent = (v / 10000).toFixed(2);
                            return ctx.dataset.label + ': ' + ppm.toLocaleString('en-US') + ' PPM (' + percent + '%)';
                        } else {
                            return ctx.dataset.label + ': ' + v.toLocaleString('en-US') + ' ' + series.unit;
                        }
                    }
                }
            }
        },
        scales: {
            x: {
                ticks: {
                    font: { family: "'BNazanin','B Nazanin','Tahoma',serif", size: 13, weight: 'bold' },
                    color: textColor,
                    maxRotation: 60, minRotation: 45
                },
                grid: { color: gridColor, lineWidth: 1 }
            },
            y: {
                ticks: {
                    font: { family: "'Times New Roman',Times,serif", size: 14, weight: 'bold' },
                    color: textColor,
                    callback: function(v) {
                        if (isPercent) return (v*100).toFixed(0) + '%';
                        return Math.round(v).toLocaleString('en-US');
                    }
                },
                grid: { color: gridColor, lineWidth: 1 },
                beginAtZero: true
            }
        }
    };
}

function makeDataset(label, data, color, opts = {}) {
    return {
        label,
        data,
        borderColor: color,
        backgroundColor: color,
        borderWidth: opts.borderWidth || 3,
        fill: false,
        tension: 0,
        pointRadius: opts.pointRadius !== undefined ? opts.pointRadius : 6,
        pointHoverRadius: 9,
        pointBackgroundColor: color,
        pointBorderColor: '#fff',
        pointBorderWidth: 2,
        borderDash: opts.borderDash || [],
        spanGaps: opts.spanGaps !== undefined ? opts.spanGaps : true
    };
}

function addTargetLines(datasets, series, length) {
    if (series.target !== undefined && series.target !== 0) {
        datasets.push({
            label: 'هدف',
            data: Array(length).fill(series.target),
            borderColor: '#27ae60',
            borderDash: [8, 5],
            borderWidth: 3,
            pointRadius: 0,
            fill: false
        });
    }
    if (series.accept !== undefined && series.accept !== 0) {
        datasets.push({
            label: 'حد پذیرش',
            data: Array(length).fill(series.accept),
            borderColor: '#c0392b',
            borderDash: [3, 4],
            borderWidth: 3,
            pointRadius: 0,
            fill: false
        });
    }
}

function destroyChart(key) {
    if (CHARTS[key]) { CHARTS[key].destroy(); CHARTS[key] = null; }
}

function renderSingleChart(canvasId, labels, data, seriesKey, datasetLabel, color, spanGaps) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    destroyChart(canvasId);
    const series = DATA[seriesKey];
    const tabColor = color || getTabColor(currentTab);
    const datasets = [makeDataset(datasetLabel || 'مقدار واقعی', data, tabColor, { spanGaps: spanGaps !== undefined ? spanGaps : true })];
    addTargetLines(datasets, series, labels.length);
    CHARTS[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: getChartOptions(series)
    });
}

function renderChart(subId) {
    const seriesKey = SUB_TO_DATA[subId];
    const series = DATA[seriesKey];
    if (!series) return;

    const avg = calculateAverage(seriesKey);
    const formatted = formatAvgValue(avg, series);
    const avgEl = document.getElementById('avg-' + subId);
    const avgPercentEl = document.getElementById('avg-percent-' + subId);
    if (avgEl) avgEl.textContent = formatted.main;
    if (avgPercentEl) avgPercentEl.textContent = formatted.percent;

    const wrapper = document.querySelector(`#sub-${subId} .chart-wrapper`);
    if (wrapper) {
        const badge = wrapper.querySelector('.unit-badge');
        if (badge) badge.style.background = getTabColor(currentTab);
    }

    const singleEl = document.getElementById('chart-container-' + subId);
    const multiEl = document.getElementById('multi-' + subId);
    const yoyEl = document.getElementById('yoy-' + subId);
    
    if (singleEl) singleEl.style.display = (!overviewMode && !yoyMode) ? 'block' : 'none';
    if (multiEl) multiEl.style.display = overviewMode ? 'grid' : 'none';
    if (yoyEl) yoyEl.style.display = yoyMode ? 'block' : 'none';

    destroyChart('chart-' + subId);
    destroyChart('chart-' + subId + '-m');
    destroyChart('chart-' + subId + '-q');
    destroyChart('chart-' + subId + '-s');
    destroyChart('chart-' + subId + '-y');
    destroyChart('chart-' + subId + '-yoy');

    const isQ = series.quarterly === true;

    if (yoyMode) {
        if (isQ) {
            renderYoYQuarterlyChart('chart-' + subId + '-yoy', seriesKey);
        } else {
            renderYoYChart('chart-' + subId + '-yoy', seriesKey);
        }
        return;
    }

    if (overviewMode) {
        if (isQ) {
            const year = document.getElementById('yearFilter').value;
            const tl = maskTimelineByYear(getQuarterTimeline(series), year);
            const aggQ = aggregateQuarterTimeline(tl, 1);
            const aggS = aggregateQuarterTimeline(tl, 2);
            const aggY = aggregateQuarterTimeline(tl, 4);
            
            const monthlyContainer = document.getElementById('chart-' + subId + '-m').parentElement;
            if (monthlyContainer) monthlyContainer.style.display = 'none';
            
            renderSingleChart('chart-' + subId + '-q', aggQ.labels, aggQ.data, seriesKey, 'سه‌ماهه');
            renderSingleChart('chart-' + subId + '-s', aggS.labels, aggS.data, seriesKey, 'شش‌ماهه');
            renderSingleChart('chart-' + subId + '-y', aggY.labels, aggY.data, seriesKey, 'سالانه');
        } else if (series.isOEE) {
            /* ⭐ اصلاح: فقط داده‌های معتبر را در نظر بگیر */
            const indices = getFilteredIndices();
            const baseData = indices.map(i => ({ l: ALL_MONTHLY_LABELS[i], v: series.values[i] })).filter(x => !isNaN(x.v) && x.v !== null);
            const L = baseData.map(x => x.l);
            const D = baseData.map(x => x.v);
            
            const aggM = { labels: L, data: D };
            const aggQ = aggregateOEEQuarterlyFromData(L, D);
            const aggS = aggregateOEESemiFromData(L, D);
            const aggY = aggregateOEEYearlyFromData(L, D);
            
            const monthlyContainer = document.getElementById('chart-' + subId + '-m').parentElement;
            if (monthlyContainer) monthlyContainer.style.display = 'block';
            
            renderSingleChart('chart-' + subId + '-m', aggM.labels, aggM.data, seriesKey, 'ماهانه');
            renderSingleChart('chart-' + subId + '-q', aggQ.labels, aggQ.data, seriesKey, 'سه‌ماهه');
            renderSingleChart('chart-' + subId + '-s', aggS.labels, aggS.data, seriesKey, 'شش‌ماهه');
            renderSingleChart('chart-' + subId + '-y', aggY.labels, aggY.data, seriesKey, 'سالانه');
        } else {
            const indices = getFilteredIndices();
            const aggM = getMonthlyPPM(seriesKey);
            const aggQ = aggregatePPMQuarterly(series.production, series.scrap, indices);
            const aggS = aggregatePPMSemi(series.production, series.scrap, indices);
            const aggY = aggregatePPMYearly(series.production, series.scrap, indices);
            
            const monthlyContainer = document.getElementById('chart-' + subId + '-m').parentElement;
            if (monthlyContainer) monthlyContainer.style.display = 'block';
            
            renderSingleChart('chart-' + subId + '-m', aggM.labels, aggM.data, seriesKey, 'ماهانه');
            renderSingleChart('chart-' + subId + '-q', aggQ.labels, aggQ.data, seriesKey, 'سه‌ماهه');
            renderSingleChart('chart-' + subId + '-s', aggS.labels, aggS.data, seriesKey, 'شش‌ماهه');
            renderSingleChart('chart-' + subId + '-y', aggY.labels, aggY.data, seriesKey, 'سالانه');
        }
        return;
    }

    if (isQ) {
        const year = document.getElementById('yearFilter').value;
        const tl = maskTimelineByYear(getQuarterTimeline(series), year);
        const span = (viewMode === 'semiannual') ? 2 : (viewMode === 'yearly') ? 4 : 1;
        const agg = aggregateQuarterTimeline(tl, span);
        const name = (span === 1) ? 'سه‌ماهه' : (span === 2) ? 'شش‌ماهه' : 'سالانه';
        renderSingleChart('chart-' + subId, agg.labels, agg.data, seriesKey, name);
    } else if (series.isOEE) {
        const indices = getFilteredIndices();
        let labels, data;
        if (viewMode === 'monthly') {
            labels = indices.map(i => ALL_MONTHLY_LABELS[i]);
            data = indices.map(i => series.values[i]);
            const valid = [];
            labels.forEach((l, i) => {
                if (!isNaN(data[i]) && data[i] !== null) valid.push({ l, v: data[i] });
            });
            labels = valid.map(x => x.l);
            data = valid.map(x => x.v);
        } else if (viewMode === 'quarterly') {
            const baseData = indices.map(i => ({ l: ALL_MONTHLY_LABELS[i], v: series.values[i] })).filter(x => !isNaN(x.v) && x.v !== null);
            const L = baseData.map(x => x.l);
            const D = baseData.map(x => x.v);
            const agg = aggregateOEEQuarterlyFromData(L, D);
            labels = agg.labels; data = agg.data;
        } else if (viewMode === 'semiannual') {
            const baseData = indices.map(i => ({ l: ALL_MONTHLY_LABELS[i], v: series.values[i] })).filter(x => !isNaN(x.v) && x.v !== null);
            const L = baseData.map(x => x.l);
            const D = baseData.map(x => x.v);
            const agg = aggregateOEESemiFromData(L, D);
            labels = agg.labels; data = agg.data;
        } else {
            const baseData = indices.map(i => ({ l: ALL_MONTHLY_LABELS[i], v: series.values[i] })).filter(x => !isNaN(x.v) && x.v !== null);
            const L = baseData.map(x => x.l);
            const D = baseData.map(x => x.v);
            const agg = aggregateOEEYearlyFromData(L, D);
            labels = agg.labels; data = agg.data;
        }
        renderSingleChart('chart-' + subId, labels, data, seriesKey);
    } else {
        let labels, data;
        if (viewMode === 'monthly') {
            const agg = getMonthlyPPM(seriesKey);
            labels = agg.labels; data = agg.data;
        } else if (viewMode === 'quarterly') {
            const indices = getFilteredIndices();
            const agg = aggregatePPMQuarterly(series.production, series.scrap, indices);
            labels = agg.labels; data = agg.data;
        } else if (viewMode === 'semiannual') {
            const indices = getFilteredIndices();
            const agg = aggregatePPMSemi(series.production, series.scrap, indices);
            labels = agg.labels; data = agg.data;
        } else {
            const indices = getFilteredIndices();
            const agg = aggregatePPMYearly(series.production, series.scrap, indices);
            labels = agg.labels; data = agg.data;
        }
        renderSingleChart('chart-' + subId, labels, data, seriesKey);
    }
}

function renderYoYChart(canvasId, seriesKey) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    destroyChart(canvasId);
    const series = DATA[seriesKey];
    const colors = getYoyColors();
    const datasets = [];

    YEARS.forEach((year, idx) => {
        const startIdx = (year - 1402) * 12;
        let data;
        if (series.isOEE) {
            data = series.values.slice(startIdx, startIdx + 12);
        } else {
            const prod = series.production.slice(startIdx, startIdx + 12);
            const scrap = series.scrap.slice(startIdx, startIdx + 12);
            data = [];
            for (let m = 0; m < 12; m++) {
                const p = prod[m], s = scrap[m];
                if (!isNaN(p) && p !== null && !isNaN(s) && s !== null) {
                    if (p === 0) {
                        if (s === 0) {
                            data.push(0);
                        } else {
                            data.push(null);
                        }
                    } else {
                        data.push(+((s / p) * 1000000).toFixed(2));
                    }
                } else {
                    data.push(null);
                }
            }
        }
        const hasData = data.some(v => v !== null && !isNaN(v));
        if (hasData) {
            datasets.push(makeDataset(String(year), data, colors[idx], { spanGaps: false }));
        }
    });

    addTargetLines(datasets, series, 12);

    CHARTS[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { labels: MONTHS_FA, datasets },
        options: getChartOptions(series)
    });
}

/* ⭐ اصلاح: YoY برای شاخص‌های سه‌ماهه - شناسایی صحیح سال‌ها */
function renderYoYQuarterlyChart(canvasId, seriesKey) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    destroyChart(canvasId);
    const series = DATA[seriesKey];
    const colors = getYoyColors();
    const datasets = [];

    /* ⭐ اصلاح: شناسایی صحیح سال‌ها با تبدیل عدد دو رقمی به چهار رقمی */
    const availableYears = [];
    YEARS.forEach(year => {
        const yearData = series.values.filter((v, i) => {
            const parts = series.labels[i].split(' ');
            const labelYearShort = parseInt(parts[1], 10);
            const labelYear = labelYearShort < 100 ? 1400 + labelYearShort : labelYearShort;
            return labelYear === year && !isNaN(v) && v !== null;
        });
        if (yearData.length > 0) availableYears.push(year);
    });

    availableYears.forEach((year) => {
        const colorIdx = YEARS.indexOf(year);
        const data = [];
        SEASONS_FA.forEach(season => {
            const label = season + ' ' + String(year).slice(-2);
            const i = series.labels.indexOf(label);
            if (i >= 0 && !isNaN(series.values[i]) && series.values[i] !== null) {
                data.push(series.values[i]);
            } else {
                data.push(null);
            }
        });
        if (data.some(v => v !== null)) {
            datasets.push(makeDataset(String(year), data, colors[colorIdx], { spanGaps: false }));
        }
    });

    if (datasets.length === 0) {
        CHARTS[canvasId] = new Chart(ctx, {
            type: 'line',
            data: { labels: SEASONS_FA, datasets: [] },
            options: getChartOptions(series)
        });
        return;
    }

    addTargetLines(datasets, series, 4);

    CHARTS[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { labels: SEASONS_FA, datasets },
        options: getChartOptions(series)
    });
}

function switchTab(tabId) {
    currentTab = tabId;
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    const btn = document.querySelector('[data-tab="' + tabId + '"]');
    if (btn) btn.classList.add('active');
    const firstSubBtn = document.querySelector('#' + tabId + ' .sub-tab-btn');
    if (firstSubBtn) switchSubTab(firstSubBtn.dataset.subtab);
}

function switchSubTab(subId) {
    document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.sub-pane').forEach(p => p.classList.remove('active'));
    const btn = document.querySelector('[data-subtab="' + subId + '"]');
    if (btn) btn.classList.add('active');
    const pane = document.getElementById('sub-' + subId);
    if (pane) pane.classList.add('active');
    currentSubTab = subId;
    currentTab = SUB_TO_TAB[subId] || currentTab;
    
    updateViewModeOptions();
    
    setTimeout(() => renderChart(subId), 50);
}

function updateCurrentChart() {
    renderChart(currentSubTab);
}

function resetFilters() {
    document.getElementById('yearFilter').value = 'all';
    document.getElementById('monthFilter').value = 'all';
    document.getElementById('modeOverview').checked = false;
    document.getElementById('modeYoY').checked = false;
    overviewMode = false;
    yoyMode = false;
    document.getElementById('modeOverviewBox').classList.remove('active-mode');
    document.getElementById('modeYoYBox').classList.remove('active-mode');
    updateViewModeOptions();
    updateCurrentChart();
}

function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const icon = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');
    if (theme === 'dark') { icon.textContent = '☀️'; label.textContent = 'حالت روز'; }
    else { icon.textContent = '🌙'; label.textContent = 'حالت شب'; }
    localStorage.setItem('theme', theme);
    updateCurrentChart();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
}

window.addEventListener('load', () => {
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    buildTabContent();

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    document.getElementById('tabContent').addEventListener('click', (e) => {
        if (e.target.classList.contains('sub-tab-btn')) {
            switchSubTab(e.target.dataset.subtab);
        }
    });

    document.getElementById('yearFilter').addEventListener('change', updateCurrentChart);
    document.getElementById('monthFilter').addEventListener('change', updateCurrentChart);
    document.getElementById('viewModeFilter').addEventListener('change', (e) => {
        viewMode = e.target.value;
        updateCurrentChart();
    });

    document.getElementById('modeOverview').addEventListener('change', (e) => {
        overviewMode = e.target.checked;
        if (overviewMode) {
            document.getElementById('modeYoY').checked = false;
            yoyMode = false;
            document.getElementById('modeYoYBox').classList.remove('active-mode');
        }
        document.getElementById('modeOverviewBox').classList.toggle('active-mode', overviewMode);
        updateCurrentChart();
    });

    document.getElementById('modeYoY').addEventListener('change', (e) => {
        yoyMode = e.target.checked;
        if (yoyMode) {
            document.getElementById('modeOverview').checked = false;
            overviewMode = false;
            document.getElementById('modeOverviewBox').classList.remove('active-mode');
        }
        document.getElementById('modeYoYBox').classList.toggle('active-mode', yoyMode);
        updateCurrentChart();
    });

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    updateViewModeOptions();
    renderChart('internal-total');
});
</script>
